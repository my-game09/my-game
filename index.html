<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Zone</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #0d0d0d; color: white; text-align: center; }
        header { background: linear-gradient(to right, #ff9900, #ff6600); padding: 40px 10px; }
        h1 { margin: 0; font-size: 2.5em; }
        p { font-size: 1.2em; color: #ddd; }
        .container { max-width: 600px; margin: 20px auto; padding: 10px; }
        .card { background-color: #1f1f1f; border-radius: 15px; padding: 20px; margin: 15px 0; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .btn { display: inline-block; padding: 12px 25px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        footer { margin-top: 30px; padding: 20px; color: #777; font-size: 0.9em; }
    </style>
</head>
<body>

<header>
    <h1>🎮 My Game Zone</h1>
    <p>বাংলাদেশের সেরা অনলাইন গেমিং প্ল্যাটফর্ম</p>
</header>

<div class="container">
    <div class="card">
        <h2>🎲 লটারি ড্র</h2>
        <p>প্রতিদিন নতুন লটারি খেলুন এবং জিতুন!</p>
        <a href="#" class="btn">খেলা শুরু করুন</a>
    </div>

    <div class="card">
        <h2>🎰 ক্যাসিনো গেম</h2>
        <p>স্পিন করুন এবং বোনাস পান।</p>
        <a href="#" class="btn">আজই যোগ দিন</a>
    </div>
</div>

<footer>
    &copy; 2026 My Game Zone. All Rights Reserved.
</footer>

</body>
</html>
